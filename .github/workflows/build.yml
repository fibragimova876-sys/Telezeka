name: iOS unsigned release
on:
  push:
    branches: [main]
    paths:
      - client/**
      - scripts/prepare.py
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telezeka-ios-current
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: python scripts/prepare.py
      - run: flutter pub get
        working-directory: build_app
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart
        working-directory: build_app
      - run: flutter build ios --release --no-codesign --build-name=0.4.1 --build-number=${{ github.run_number }} --dart-define=TELEZEKA_VERSION=0.4.1
        working-directory: build_app
      - name: Package unsigned IPA
        run: |
          mkdir -p dist ios-package/Payload
          ditto build_app/build/ios/iphoneos/Runner.app ios-package/Payload/Runner.app
          (cd ios-package && ditto -c -k --sequesterRsrc --keepParent Payload ../dist/Telezeka-iOS-unsigned.ipa)
          (cd dist && shasum -a 256 Telezeka-iOS-unsigned.ipa > SHA256SUMS.txt)
          printf '%s\n' "$GITHUB_SHA" > dist/build-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Telezeka-iOS-unsigned
          path: dist/*
          if-no-files-found: error
      - name: Publish unsigned iOS preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="v0.4.1-ios.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Telezeka 0.4.1 iOS (unsigned)" --notes "Unsigned IPA: Apple signing and a suitable provisioning profile are required before installation. Experimental software; server deployment required."
          fi
