[package]
name = "telezeka-core"
version = "0.3.0"
edition = "2021"
[dependencies]
axum = "=0.8.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
